<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Basics</title>
    <style>
        .styleClass {
            color: red;
            background-color: yellow;
            font-size: 57px;
        }
        #thing {
            width: 800px;
        }
    </style>
    <script>
        window.onload = function() {
            //selecting element based on id
            document.getElementById("demo").innerHTML = "Hello, JavaScript!";

            //selecting element based on class
            document.getElementsByClassName("myClass")[0].innerHTML = "This is updated text for the Div with class 'myClass.'";

            //selecting element based on tag name
            document.getElementsByTagName("p")[0].style.color = "blue";
            //try to change the color of the second paragraph and try adding some font style to it as well
             document.getElementsByTagName("p")[1].style.color = "aqua";
             //document.getElementsByTagName("p")[1].style.fontStyle = "italic";
             //document.getElementsByTagName("p")[1].style.fontSize = "47px";
             document.getElementsByTagName("p")[1].style.font = "italic bold 47px Arial, sans-serif";
             //document.getElementsByTagName("p")[1].style.fontWeight = "bold";\
             //document.getElementsByTagName("p")[1].style.fontFamily = "Arial, sans-serif";
             document.getElementsByTagName("p")[1].style.textDecoration = "underline";
             document.getElementById("demo").className = "styleClass";

             var newParagraph = document.createElement("p");
             newParagraph.innerHTML = "This is a new paragraph created using JavaScript.";
             document.body.appendChild(newParagraph);
        };
        function changeText() {
            // Change the text of the first paragraph when the button is clicked
            document.getElementsByTagName("p")[0].innerHTML = "You clicked the button! The text has been changed.";
            
        }
        function changeImage() {
            // Change the source of the image when the button is clicked
            document.getElementById("thing").src = "https://images.panda.org/assets/images/pages/welcome/orangutan_1600x1000_279157.jpg";
        }
    </script>
    </head>
    <body>
        <h1>JavaScript Basics</h1>
        <p>This is a simple HTML page to demonstrate basic JavaScript functionality.</p>
        <p id="demo">Paragraph with ID "demo".</p>
        <img id="thing" src="https://uploads.sitepoint.com/wp-content/uploads/2016/03/1458289957powerful-images3.jpg" alt="Sample Image">
        <div class="myClass">Div with class "myClass."</div>
        <button onclick="changeText()">Click Me!</button>
        <button onclick="changeImage()">Change Image</button>
    </body>
    
</html>
