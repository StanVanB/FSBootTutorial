<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap Grid System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    </head>
    <body>
        <h1>Bootstrap Grid System</h1>
        <div class="container">
            <div class="row">
                <div class="col-sm-2" style="background-color: lightblue;">Column 1</div>
                <div class="col-sm-3" style="background-color: lightgreen;">Column 2</div>
                <div class="col-sm-4" style="background-color: lightcoral;">Column 3</div>
                <div class="col-sm-3" style="background-color: lightpink;">Column 4</div>
            </div>
            <div class="row">
                <div class="col-sm-18" style="background-color: lightyellow;">Column 5</div>
                <div class="col-sm-22" style="background-color: lightgray;">Column 6</div>
                <div class="col-sm-6" style="background-color: lightblue;">Column 7</div>
                <div class="col-sm-6" style="background-color: lightgreen;">Column 8</div>
            </div>
        </div>
    </body>
</html>
