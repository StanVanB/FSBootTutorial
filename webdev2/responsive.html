<!DOCTYPE html>
<html>
    <head>
        <title>Responsive Page</title>
        <style>
            .parent {
                font-size: 14px;
            }

            .child {
                font-size: 2em;            
            }

            img {
                max-width: 100%;
                height: auto;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            This is a parent element.
        </div>
        <div class="child">
            This is a child element.
        </div>
        <div class="child">
            This is a child element.
        </div>

        
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-8Ne4j_5gRNNikzu_KZRIyzSihAQ74KAbiQ&s" alt="Responsive image">
        
    </body>        
</html>
